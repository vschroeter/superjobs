[project]
name = "superjobs-contract-example"
version = "0.0.1"
description = "Shared Job contracts for the contract-interface example"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "superjobs>=0.1.0",
]

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[tool.uv.sources]
superjobs = { path = "../../..", editable = true }

[tool.uv.build-backend]
module-name = "superjobs_contract_example"
module-root = "src"
