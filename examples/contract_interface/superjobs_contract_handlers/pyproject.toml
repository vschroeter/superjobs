[project]
name = "superjobs-contract-handlers"
version = "0.0.1"
description = "Shared HandlerCatalog for contract-interface CLI and worker examples"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "superjobs>=0.1.0",
    "superjobs-contract-example>=0.0.1",
]

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[tool.uv.sources]
superjobs = { path = "../../..", editable = true }
superjobs-contract-example = { path = "../superjobs_contract_example", editable = true }

[tool.uv.build-backend]
module-name = "superjobs_contract_handlers"
module-root = "src"
