[project]
name = "superjobs"
version = "0.1.0"
description = "Pre-alpha typed asynchronous jobs over NATS JetStream with shared contract packages for producers and workers."
readme = "README.md"
authors = [
    { name = "Valentin Schröter", email = "valentin@kunstkabinett-ton-in-ton.de" }
]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
]
dependencies = [
    "faststream[nats]>=0.7.4",
    "msgpack>=1.2.1",
    "pydantic>=2.13.4",
]

[project.optional-dependencies]
cli = [
    "typer>=0.27.2",
]

[project.urls]
Homepage = "https://github.com/vschroeter/superjobs"
Documentation = "https://github.com/vschroeter/superjobs/tree/main/docs"
Repository = "https://github.com/vschroeter/superjobs"
Issues = "https://github.com/vschroeter/superjobs/issues"

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "typer>=0.27.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "nats: integration tests requiring a live NATS JetStream server (fail when unavailable)",
    "contract_typing: contract-interface Pyright gate and wheel-origin checks (select with -m contract_typing)",
    "cross_program: cross-program installed-wheel verification helpers (see tools/verify_cross_program.py)",
]
