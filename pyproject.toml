[project]
name = "superjobs"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Valentin Schröter", email = "valentin@kunstkabinett-ton-in-ton.de" }
]
requires-python = ">=3.12"
dependencies = [
    "faststream[nats]>=0.7.4",
    "msgpack>=1.2.1",
    "pydantic>=2.13.4",
]

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "nats: tests requiring a live NATS JetStream server",
]
